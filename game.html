<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title> SKY DODGE - GAME </title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --glow: transparent; }
        .coin-icon { width: 20px; height: 20px; vertical-align: middle; margin-left: 5px; border-radius: 50%; }

        body {
            margin: 0; overflow: hidden; background: #000; color: white;
            font-family: sans-serif; touch-action: none; display: flex;
            justify-content: center; user-select: none; -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 500px; /* KHÔNG CHO QUÁ TO TRÊN MÁY TÍNH */
            background: radial-gradient(circle, #1a1a2e, #000);
            overflow: hidden;
        }
        @media (min-width: 501px) {
            /* Trên máy tính: viền khung chơi để phân biệt vùng chơi */
            #game-container { border-left: 1px solid #333; border-right: 1px solid #333; }
        }


        #paddle {
            position: absolute; bottom: 120px; left: 50%;
            height: 18px; border-radius: 10px;
            transform: translateX(-50%); z-index: 100;
            transition: background 0.3s, width 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 15px var(--glow); /* Hiệu ứng tỏa sáng cho ván xịn */
            will-change: left;
        }

        .ui { position: fixed; top: 20px; width: 100%; max-width: 500px; text-align: center; pointer-events: none; z-index: 200; }
        .red { color: #ff4d4d; font-weight: bold; font-size: 26px; }
        .progress-bg { width: 80%; max-width: 300px; height: 15px; background: #333; margin: 5px auto; border-radius: 10px; overflow: hidden; }
        #bar { height: 100%; width: 0%; background: #4CAF50; transition: 0.1s; }
        .falling-item { position: absolute; width: 45px; pointer-events: none; object-fit: contain; will-change: top; }

        #msg {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 300; background: rgba(0,0,0,0.95); padding: 25px;
            width: 80%; max-width: 400px; border: 2px solid red; border-radius: 15px;
        }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        button { padding: 15px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; font-weight: bold; width: 100%; transition: 0.15s; }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.97); }
        .btn-retry { background: #ff4d4d; color: white; }
        .btn-home { background: #2196F3; color: white; }

        /* Giảm chuyển động trên thiết bị cài đặt giảm chuyển động */
        @media (prefers-reduced-motion: reduce) {
            #paddle { transition: none; }
            #bar { transition: none; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <div class="ui">
        <div style="font-size: 18px;">⏱ Thời gian: <span id="timer">0</span>s</div>
        <div class="red">Khối lượng: <span id="num">0</span> / <span id="max-num">100</span></div>
        <div class="progress-bg"><div id="bar"></div></div>
    </div>
    <div id="paddle"></div>
    <div id="msg">
        <h1 style="color:red; margin-top:0;">GAME OVER</h1>
        <p id="final-stats" style="font-size: 18px;"></p>
        <p id="coin-stats" style="color: #ffeb3b; font-weight: bold;"></p>
        <div class="btn-group">
            <button class="btn-retry" onclick="location.reload()">QUAY LẠI CHƠI TIẾP</button>
            <button class="btn-home" onclick="location.href='index.html'">VỀ TRANG CHỦ</button>
        </div>
    </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyBbdRgcZmqt5-ywPyssZ1C2CDoj11slDQs",authDomain:"sky-dodge-8f537.firebaseapp.com",databaseURL:"https://sky-dodge-8f537-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sky-dodge-8f537",storageBucket:"sky-dodge-8f537.firebasestorage.app",messagingSenderId:"169224412363",appId:"1:169224412363:web:de0d018158d8b34e854f4e"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth();
const paddles=[{id:'default',cap:3,color:'#8d6e63',width:125},{id:'stone',cap:5,color:'#757575',width:120},{id:'iron',cap:8,color:'#b0bec5',width:115},{id:'bronze',cap:10,color:'#cd7f32',width:110},{id:'leaf',cap:12,color:'#4caf50',width:105},{id:'ocean',cap:15,color:'#2196f3',width:100},{id:'pink',cap:20,color:'#f06292',width:95},{id:'gold',cap:25,color:'#ffd54f',width:90},{id:'diamond',cap:28,color:'#4fc3f7',width:85},{id:'obsidian',cap:30,color:'linear-gradient(45deg,#000 30%,#4a008a 60%,#9d00ff 100%)',width:80}];
const itemTypes=[{url:'https://drive.google.com/thumbnail?id=1SGW0oc5yuw1WmArQ9GbNSQYBPbmXRWdi&sz=w200',chance:60,weight:1,type:'normal'},{url:'https://drive.google.com/thumbnail?id=17JZiAW3NHJvEg2iN679TdNB_DVlKN7xz&sz=w200',chance:25,weight:2,type:'normal'},{url:'https://drive.google.com/thumbnail?id=1KeXUOKM47cK2pO6UNCfvygAOiMARMaH1&sz=w200',chance:10,weight:3,type:'normal'},{url:'https://drive.google.com/thumbnail?id=19ryEq9TvAxEdriBohrz5zrEHY11xkapE&sz=w200',chance:4,weight:.3,type:'percent'},{url:'https://drive.google.com/thumbnail?id=1IKc60y8Dn1ouIsFFzYw22oIcHM0Oxnjk&sz=w200',chance:1,weight:0,type:'danger'}];
let gameOver=false,score=0,seconds=0,baseSpeed=5,timerInterval=null,spawnTimeout=null,fallIntervals=new Set(),user=null,sessionId='';const paddle=document.getElementById('paddle'),numDisp=document.getElementById('num'),barDisp=document.getElementById('bar'),timerDisp=document.getElementById('timer'),container=document.getElementById('game-container'),msg=document.getElementById('msg');
function setPresence(uid){const c=db.ref('.info/connected'),s=db.ref('status/'+uid);const h=x=>{if(x.val()!==true)return;s.onDisconnect().set({state:'offline',last_changed:firebase.database.ServerValue.TIMESTAMP}).then(()=>s.set({state:'online',last_changed:firebase.database.ServerValue.TIMESTAMP}));};c.on('value',h);return()=>c.off('value',h);}
function cleanup(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}if(spawnTimeout){clearTimeout(spawnTimeout);spawnTimeout=null;}fallIntervals.forEach(clearInterval);fallIntervals.clear();container.querySelectorAll('.falling-item').forEach(n=>n.remove());}
function movePaddle(x){if(gameOver)return;const r=container.getBoundingClientRect(),half=paddle.offsetWidth/2;const safe=Math.max(half,Math.min(x-r.left,r.width-half));paddle.style.left=safe+'px';}
window.addEventListener('mousemove',e=>movePaddle(e.clientX));window.addEventListener('touchstart',e=>{if(e.touches.length)movePaddle(e.touches[0].clientX);},{passive:false});window.addEventListener('touchmove',e=>{if(e.touches.length){e.preventDefault();movePaddle(e.touches[0].clientX);}}, {passive:false});
async function loadPaddle(){const snap=await db.ref('users/'+user.uid).once('value');const d=snap.val()||{};const owned=Array.isArray(d.ownedPaddles)?d.ownedPaddles:[];const selected=d.selectedPaddle&&owned.includes(d.selectedPaddle)?d.selectedPaddle:'default';const p=paddles.find(x=>x.id===selected)||paddles[0];paddle.style.background=p.color;paddle.style.width=p.width+'px';document.getElementById('max-num').innerText=p.cap;return p.cap;}
async function saveGameData(){if(!user)return;const reward=Math.max(0,Math.floor(seconds));try{const userRef=db.ref('users/'+user.uid);const result=await userRef.transaction(d=>{if(!d)return d;d.gameRewards=d.gameRewards||{};if(d.gameRewards[sessionId])return d;d.coins=Math.max(0,Number(d.coins)||0)+reward;d.highScore=Math.max(Number(d.highScore)||0,reward);d.gameRewards[sessionId]={seconds:reward,claimedAt:firebase.database.ServerValue.TIMESTAMP};return d;});if(!result.committed){const again=await userRef.once('value');if(!again.child('gameRewards/'+sessionId).exists())throw new Error('Không thể ghi phần thưởng.');}const scoreRef=db.ref('leaderboard/'+user.uid);await scoreRef.transaction(v=>{const old=Number(v?.score)||0;if(reward<=old)return v;return{name:user.displayName||user.email?.split('@')[0]||'Người chơi',score:reward,updatedAt:firebase.database.ServerValue.TIMESTAMP};});const coin=document.getElementById('coin-stats');coin.innerHTML='';coin.append(document.createTextNode('+'+reward+' Xu đã nhận!'));}catch(e){console.error(e);document.getElementById('coin-stats').textContent='Chưa thể ghi phần thưởng. Vui lòng thử lại.';}}
function createItem(currentMax){if(gameOver)return;let r=Math.random()*100,c=0,sel=itemTypes[0];for(const t of itemTypes){c+=t.chance;if(r<c){sel=t;break;}}const item=document.createElement('img');item.src=sel.url;item.className='falling-item';item.alt='';item.draggable=false;item.style.left=Math.max(0,Math.random()*(container.offsetWidth-45))+'px';item.style.top='-100px';item.onerror=()=>{item.remove();};container.appendChild(item);let top=-100;const speed=baseSpeed+Math.random()*2,containerHeight=container.offsetHeight;const iv=setInterval(()=>{if(gameOver){clearInterval(iv);fallIntervals.delete(iv);item.remove();return;}top+=speed;item.style.top=top+'px';const p=paddle.getBoundingClientRect(),i=item.getBoundingClientRect();if(i.bottom>=p.top&&i.right>=p.left&&i.left<=p.right&&i.top<=p.bottom){clearInterval(iv);fallIntervals.delete(iv);item.remove();if(sel.type==='danger')return endGame('KHỐI LƯỢNG QUÁ TẢI!');if(sel.type==='percent')score+=Math.max(1,Math.round(score*sel.weight));else score+=sel.weight;score=Math.min(currentMax,score);numDisp.innerText=Math.round(score);barDisp.style.width=Math.min(score/currentMax*100,100)+'%';if(score>=currentMax)endGame('QUÁ TẢI RỒI!');}else if(top>containerHeight){clearInterval(iv);fallIntervals.delete(iv);item.remove();}},20);fallIntervals.add(iv);}
function spawnLoop(currentMax){if(gameOver)return;createItem(currentMax);spawnTimeout=setTimeout(()=>spawnLoop(currentMax),Math.max(250,850-seconds*12));}
async function endGame(title){if(gameOver)return;gameOver=true;cleanup();document.querySelector('#msg h1').innerText=title;document.getElementById('final-stats').innerText=`Bạn đã trụ được ${seconds} giây!`;msg.style.display='block';paddle.style.background='red';await saveGameData();}
function startGame(currentMax){timerInterval=setInterval(()=>{if(gameOver)return;seconds++;timerDisp.innerText=seconds;if(seconds%7===0)baseSpeed+=.8;},1000);spawnLoop(currentMax);}
auth.onAuthStateChanged(async u=>{if(!u){location.href='auth.html';return;}user=u;setPresence(u.uid);sessionId='single-'+u.uid+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);try{const max=await loadPaddle();startGame(max);}catch(e){console.error(e);location.href='index.html';}});
window.addEventListener('pagehide',cleanup);
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});document.addEventListener('keydown',e=>{if(e.ctrlKey&&['+','-','=','0'].includes(e.key))e.preventDefault();});

</script>
</body>
</html>
