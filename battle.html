<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title> SKY DODGE - BATTLE </title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --glow: transparent; }
        .coin-icon { width: 20px; height: 20px; vertical-align: middle; margin-left: 5px; border-radius: 50%; }
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; touch-action: none; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
        #game-container {
            position: relative;
            width: 100vw; /* Ưu tiên 100% chiều rộng trên điện thoại */
            max-width: 450px; /* KHÔNG CHO QUÁ TO TRÊN MÁY TÍNH (Duy có thể chỉnh số này) */
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle, #1a1a2e, #000);
            overflow: hidden;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            margin: 0 auto; /* Căn giữa khung chơi khi dùng máy tính */
        }
        #paddle { position: absolute; bottom: 120px; left: 50%; height: 18px; border-radius: 10px; transform: translateX(-50%); z-index: 100; transition: background 0.3s, width 0.3s, box-shadow 0.3s; will-change: left; }
        .ui { position: fixed; top: 20px; width: 100%; max-width: 500px; text-align: center; pointer-events: none; z-index: 200; }
        .red { color: #ff4d4d; font-weight: bold; font-size: 26px; }
        .progress-bg { width: 80%; max-width: 300px; height: 15px; background: #333; margin: 5px auto; border-radius: 10px; overflow: hidden; }
        #bar { height: 100%; width: 0%; background: #4CAF50; transition: 0.1s; }
        .falling-item { position: absolute; width: 45px; pointer-events: none; object-fit: contain; will-change: top; }
        #msg { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 300; background: rgba(0,0,0,0.95); padding: 25px; width: 80%; max-width: 400px; border: 2px solid #ffeb3b; border-radius: 15px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        button { padding: 15px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; font-weight: bold; width: 100%; transition: 0.15s; }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.97); }
        .btn-home { background: #f1c40f; color: black; }
        #stats-list { margin: 15px 0; text-align: left; font-size: 14px; max-height: 150px; overflow-y: auto; }
        .stat-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }

        @media (prefers-reduced-motion: reduce) {
            #paddle { transition: none; }
            #bar { transition: none; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <div class="ui">
        <div style="font-size: 18px;">⏱ Thời gian: <span id="timer">0</span>s</div>
        <div class="red">Khối lượng: <span id="num">0</span> / <span id="max-num">100</span></div>
        <div class="progress-bg"><div id="bar"></div></div>
    </div>
    <div id="paddle"></div>
   <div id="msg" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; z-index: 1000; border: 2px solid #f1c40f;">
    <h1 id="msg-title" style="margin: 0; color: #f1c40f; font-size: 28px;">KẾT THÚC</h1>

    <div id="winner-info" style="margin: 15px 0; border-bottom: 1px solid #444; padding-bottom: 10px;"></div>

    <div style="font-size: 14px; color: #aaa; margin-bottom: 5px; text-align: left;">Chi tiết trận đấu:</div>
    <div id="stats-list" style="max-height: 150px; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; margin-bottom: 15px;">
        </div>

    <div id="end-actions" style="display:none;">
        <button onclick="goBack()" style="background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;">QUAY LẠI PHÒNG</button>
    </div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyBbdRgcZmqt5-ywPyssZ1C2CDoj11slDQs",authDomain:"sky-dodge-8f537.firebaseapp.com",databaseURL:"https://sky-dodge-8f537-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sky-dodge-8f537",storageBucket:"sky-dodge-8f537.firebasestorage.app",messagingSenderId:"169224412363",appId:"1:169224412363:web:de0d018158d8b34e854f4e"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth();const hostId=new URLSearchParams(location.search).get('id');
const paddles=[{id:'default',cap:3,color:'#8d6e63',width:125},{id:'stone',cap:5,color:'#757575',width:120},{id:'iron',cap:8,color:'#b0bec5',width:115},{id:'bronze',cap:10,color:'#cd7f32',width:110},{id:'leaf',cap:12,color:'#4caf50',width:105},{id:'ocean',cap:15,color:'#2196f3',width:100},{id:'pink',cap:20,color:'#f06292',width:95},{id:'gold',cap:25,color:'#ffd54f',width:90},{id:'diamond',cap:28,color:'#4fc3f7',width:85},{id:'obsidian',cap:30,color:'linear-gradient(45deg,#000 30%,#4a008a 60%,#9d00ff 100%)',width:80}];
const itemTypes=[{url:'https://drive.google.com/thumbnail?id=1SGW0oc5yuw1WmArQ9GbNSQYBPbmXRWdi&sz=w200',chance:60,weight:1,type:'normal'},{url:'https://drive.google.com/thumbnail?id=17JZiAW3NHJvEg2iN679TdNB_DVlKN7xz&sz=w200',chance:25,weight:2,type:'normal'},{url:'https://drive.google.com/thumbnail?id=1KeXUOKM47cK2pO6UNCfvygAOiMARMaH1&sz=w200',chance:10,weight:3,type:'normal'},{url:'https://drive.google.com/thumbnail?id=1IKc60y8Dn1ouIsFFzYw22oIcHM0Oxnjk&sz=w200',chance:5,weight:0,type:'danger'}];
const paddle=document.getElementById('paddle'),container=document.getElementById('game-container'),coinImgURL='https://drive.google.com/thumbnail?id=13GfXHlWxw_dlc3eWxlO4p5D5HY1n361H&sz=w100';let user=null,isHost=false,isPlaying=false,gameOver=false,score=0,seconds=0,baseSpeed=5,timerInterval=null,spawnTimeout=null,fallIntervals=new Set(),playerListener=null,roomListener=null,monitorListener=null,presenceCleanup=null,monitorStarted=false,resultRetry=null,lastSeenTimer=null,roomData=null;
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function setPresence(uid){const c=db.ref('.info/connected'),s=db.ref('status/'+uid);const h=x=>{if(x.val()!==true)return;s.onDisconnect().set({state:'offline',last_changed:firebase.database.ServerValue.TIMESTAMP}).then(()=>s.set({state:'online',last_changed:firebase.database.ServerValue.TIMESTAMP}));};c.on('value',h);return()=>c.off('value',h);}
function clearLoops(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}if(spawnTimeout){clearTimeout(spawnTimeout);spawnTimeout=null;}if(lastSeenTimer){clearInterval(lastSeenTimer);lastSeenTimer=null;}fallIntervals.forEach(clearInterval);fallIntervals.clear();container.querySelectorAll('.falling-item').forEach(n=>n.remove());}
function movePaddle(x){if(!isPlaying)return;const r=container.getBoundingClientRect(),half=paddle.offsetWidth/2;paddle.style.left=Math.max(half,Math.min(x-r.left,r.width-half))+'px';}
window.addEventListener('mousemove',e=>movePaddle(e.clientX));window.addEventListener('touchmove',e=>{if(e.touches.length){e.preventDefault();movePaddle(e.touches[0].clientX);}},{passive:false});
async function loadPaddle(){const s=await db.ref('users/'+user.uid).once('value'),d=s.val()||{},owned=Array.isArray(d.ownedPaddles)?d.ownedPaddles:[];const p=paddles.find(x=>x.id===d.selectedPaddle&&owned.includes(x.id))||paddles[0];paddle.style.background=p.color;paddle.style.width=p.width+'px';document.getElementById('max-num').innerText=p.cap;return p.cap;}
function createItem(max){if(!isPlaying)return;let r=Math.random()*100,c=0,sel=itemTypes[0];for(const t of itemTypes){c+=t.chance;if(r<c){sel=t;break;}}const item=document.createElement('img');item.src=sel.url;item.className='falling-item';item.alt='';item.style.left=Math.max(0,Math.random()*(container.offsetWidth-45))+'px';item.style.top='-60px';item.onerror=()=>item.remove();container.appendChild(item);let top=-60;const speed=baseSpeed+Math.random()*2,h=container.offsetHeight;const iv=setInterval(()=>{if(!isPlaying){clearInterval(iv);fallIntervals.delete(iv);item.remove();return;}top+=speed;item.style.top=top+'px';const p=paddle.getBoundingClientRect(),i=item.getBoundingClientRect();if(i.bottom>=p.top&&i.right>=p.left&&i.left<=p.right&&i.top<=p.bottom){clearInterval(iv);fallIntervals.delete(iv);item.remove();if(sel.type==='danger')endGame('BẠN ĐÃ THUA!');else{score+=sel.weight;document.getElementById('num').innerText=score;document.getElementById('bar').style.width=Math.min(score/max*100,100)+'%';if(score>=max)endGame('QUÁ TẢI RỒI!');}}else if(top>h){clearInterval(iv);fallIntervals.delete(iv);item.remove();}},20);fallIntervals.add(iv);}
function spawnLoop(max){if(!isPlaying)return;createItem(max);spawnTimeout=setTimeout(()=>spawnLoop(max),Math.max(250,850-seconds*12));}
async function endGame(title){if(!isPlaying)return;isPlaying=false;clearLoops();document.getElementById('msg').style.display='block';document.getElementById('msg-title').textContent=title;const ref=db.ref(`rooms/${hostId}/players/${user.uid}`);await ref.onDisconnect().cancel().catch(()=>{});await ref.update({state:'dead',survivalTime:seconds,lastSeen:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});try{await maybeSettle();}catch(e){console.warn(e);}}
function sortPlayers(players){return Object.entries(players).sort((a,b)=>Number(b[1]?.survivalTime||0)-Number(a[1]?.survivalTime||0)||Number(a[1]?.joinedAt||0)-Number(b[1]?.joinedAt||0)||a[0].localeCompare(b[0]));}
async function maybeSettle(){const r=db.ref(`rooms/${hostId}`);const roomSnap=await r.once('value');const data=roomSnap.val();if(!data||data.status!=='playing')return;const players=data.players||{};const entries=Object.entries(players);const alive=entries.filter(([id,p])=>p&&p.state==='alive'&&(!p.lastSeen||Date.now()-Number(p.lastSeen)<15000));if(alive.length>0)return;const stRef=r.child('settlement');const claim=await stRef.transaction(cur=>{const now=Date.now();if(!cur)return{state:'processing',by:user.uid,at:now};if(cur.state==='completed')return cur;if(cur.state==='processing'&&now-Number(cur.at||0)>15000)return{state:'processing',by:user.uid,at:now};return cur;});if(!claim.committed||claim.snapshot.val()?.by!==user.uid)return;const latest=(await r.once('value')).val();if(!latest||latest.status!=='playing')return;const ps=latest.players||{};const list=sortPlayers(ps);if(!list.length)return;const [winnerId,winner]=list[0];const prize=Math.max(0,Object.values(ps).reduce((sum,p)=>sum+Math.max(0,Number(p?.stake)||0),0));const matchNo=Number(latest.matchNo||0);const updates={};if(prize>0)updates[`users/${winnerId}/coins`]=firebase.database.ServerValue.increment(prize);updates[`rooms/${hostId}/winnerData`]={uid:winnerId,name:winner.name||'Người chơi',prize,survivalTime:Number(winner.survivalTime)||0};updates[`rooms/${hostId}/status`]='finished';updates[`rooms/${hostId}/settlement`]={state:'completed',by:user.uid,at:firebase.database.ServerValue.TIMESTAMP,matchNo,payout:{uid:winnerId,amount:prize}};await db.ref().update(updates);}
function startMonitor(){if(monitorStarted)return;monitorStarted=true;const ref=db.ref(`rooms/${hostId}/players`);monitorListener=async snap=>{const data=snap.val()||{};const alive=Object.values(data).filter(p=>p?.state==='alive'&&(!p.lastSeen||Date.now()-Number(p.lastSeen)<15000));if(alive.length===0)await maybeSettle();};ref.on('value',monitorListener);}
async function renderResult(){if(resultRetry)clearTimeout(resultRetry);const s=await db.ref(`rooms/${hostId}`).once('value'),d=s.val();if(!d||!d.winnerData){document.getElementById('msg').style.display='block';document.getElementById('msg-title').textContent='ĐANG XÁC NHẬN KẾT QUẢ…';resultRetry=setTimeout(renderResult,1000);return;}const w=d.winnerData;const me=user&&user.uid===w.uid;document.getElementById('msg').style.display='block';document.getElementById('msg-title').textContent=me?'🏆 CHIẾN THẮNG!':'KẾT THÚC';document.getElementById('msg-title').style.color=me?'#f1c40f':'#fff';document.getElementById('winner-info').innerHTML=`<div style="font-size:18px;color:#fff">${escapeHtml(w.name||'Người chơi')} THẮNG</div><div style="font-size:24px;color:#2ecc71;font-weight:bold">+${Number(w.prize||0).toLocaleString('vi-VN')} <img src="${coinImgURL}" class="coin-icon" onerror="this.style.display='none'"></div>`;const arr=sortPlayers(d.players||{});document.getElementById('stats-list').innerHTML=arr.map(([uid,p],i)=>`<div class="stat-row" style="color:${uid===w.uid?'#f1c40f':'#fff'};font-weight:${uid===w.uid?'bold':'normal'}"><span>${i+1}. ${escapeHtml(p.name||'Người chơi')}</span><span>${Number(p.survivalTime||0)}s</span></div>`).join('');document.getElementById('end-actions').style.display='block';}
async function goBack(){const r=db.ref(`rooms/${hostId}`);await r.child('players/'+user.uid).onDisconnect().cancel().catch(()=>{});if(isHost)await r.onDisconnect().cancel().catch(()=>{});if(!isHost){location.href='room.html?id='+encodeURIComponent(hostId);return;}await r.update({status:'waiting',winnerData:null,settlement:null,hostDisconnected:false,totalPrize:0});const snap=await r.child('players').once('value');const up={};Object.keys(snap.val()||{}).forEach(uid=>{up[`rooms/${hostId}/players/${uid}/state`]='waiting';up[`rooms/${hostId}/players/${uid}/survivalTime`]=0;up[`rooms/${hostId}/players/${uid}/stake`]=0;up[`rooms/${hostId}/players/${uid}/lastSeen`]=firebase.database.ServerValue.TIMESTAMP;});await db.ref().update(up);location.href='room.html?id='+encodeURIComponent(hostId);}
function cleanup(){clearLoops();if(playerListener)db.ref(`rooms/${hostId}/players/${user?.uid}`).off('value',playerListener);if(roomListener)db.ref(`rooms/${hostId}`).off('value',roomListener);if(monitorListener)db.ref(`rooms/${hostId}/players`).off('value',monitorListener);if(resultRetry)clearTimeout(resultRetry);if(presenceCleanup)presenceCleanup();}
auth.onAuthStateChanged(async u=>{if(!u||!hostId){location.href='auth.html';return;}user=u;isHost=u.uid===hostId;presenceCleanup=setPresence(u.uid);const r=db.ref(`rooms/${hostId}`),pr=r.child('players/'+u.uid);const initial=await r.once('value');roomData=initial.val();if(!roomData||roomData.status!=='playing'){if(roomData?.status==='finished')await renderResult();else location.href='room.html?id='+encodeURIComponent(hostId);return;}const existing=await pr.once('value');const existingPlayer=existing.val()||{};if(existingPlayer.state==='dead'||existingPlayer.state==='disconnected'){await renderResult();if(roomData.hostDisconnected===true)startMonitor();return;}await loadPaddle();seconds=Math.max(0,Number(existingPlayer.survivalTime)||0);document.getElementById('timer').innerText=seconds;await pr.update({state:'alive',survivalTime:seconds,lastSeen:firebase.database.ServerValue.TIMESTAMP,name:roomData.players?.[u.uid]?.name||u.displayName||'Người chơi'});pr.onDisconnect().update({state:'disconnected',disconnectedAt:firebase.database.ServerValue.TIMESTAMP});if(isHost)r.onDisconnect().update({hostDisconnected:true,hostDisconnectedAt:firebase.database.ServerValue.TIMESTAMP});isPlaying=true;const max=Number(document.getElementById('max-num').innerText)||100;roomListener=s=>{roomData=s.val();if(!roomData)return;if(roomData.status==='finished'){isPlaying=false;clearLoops();renderResult();}else if(roomData.status==='playing'&&roomData.hostDisconnected===true)startMonitor();};r.on('value',roomListener);playerListener=s=>{const d=s.val()||{};if(d.state==='disconnected'&&!gameOver)endGame('MẤT KẾT NỐI!');};pr.on('value',playerListener);timerInterval=setInterval(()=>{if(!isPlaying)return;seconds++;document.getElementById('timer').innerText=seconds;if(seconds%7===0)baseSpeed+=.8;},1000);lastSeenTimer=setInterval(()=>{if(isPlaying)pr.update({lastSeen:firebase.database.ServerValue.TIMESTAMP,survivalTime:seconds}).catch(()=>{});},5000);spawnLoop(max);if(isHost)startMonitor();});
window.addEventListener('pagehide',cleanup);

</script>
</body>
</html>
